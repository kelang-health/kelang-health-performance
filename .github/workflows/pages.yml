name: Test and deploy Kelang Health Performance
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kelang-health-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test KPI rules
        run: npm test
      - name: Refresh public aggregate HDC snapshot
        run: node scripts/sync-hdc.mjs
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
